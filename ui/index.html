<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LedgerPilot — AI Revenue Ops</title>
<style>
:root{
  --bg:#FAFAFA; --border:#ECECEC; --border-2:#E0E0E0;
  --text:#0D0D0D; --dim:#666666; --faint:#9B9B9B;
  --ok:#15803D; --warn:#B45309; --err:#DC2626;
  --panel:rgba(255,255,255,.92);
}
*{box-sizing:border-box}
html{background:#06060c}
html,body{margin:0;padding:0}
body{
  color:var(--text); min-height:100vh;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono,code,pre,.mono code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--text); outline-offset:2px}

/* ---------- animated background ---------- */
#bgVideo{
  position:fixed; inset:0; z-index:-2; width:100%; height:100%;
  object-fit:cover; filter:brightness(1.15) contrast(1.05);
}
#bgScrim{
  display:none;
}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20;
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.3);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; height:52px;
  box-shadow:0 1px 12px rgba(0,0,0,.15);
}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand h1{font-size:15px; font-weight:650; margin:0; letter-spacing:-.01em}
.brand .sub{color:var(--faint); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#statusPill{
  font-size:12px; padding:4px 10px; border-radius:999px;
  border:1px solid var(--border-2); background:rgba(255,255,255,.8); color:var(--dim);
  white-space:nowrap;
}
#statusPill.ok{color:var(--ok); border-color:#D5EADF; background:#F2FAF6}
#statusPill.warn{color:var(--warn); border-color:#F5E3C8; background:#FDF8EF}

/* ---------- banner ---------- */
#banner{
  display:none; background:#FDF9EC; color:#92600A;
  border-bottom:1px solid #F3E7C6; padding:8px 24px; font-size:13px;
  align-items:center; gap:12px;
}
#banner.show{display:flex}
#banner button{
  background:#fff; border:1px solid #E7D9AE; color:#92600A; border-radius:7px;
  padding:3px 10px; cursor:pointer; font-size:12px;
}
#banner a.ghost{padding:3px 10px; font-size:12px; text-decoration:none}

/* ---------- layout ---------- */
main{max-width:760px; margin:0 auto; padding:36px 16px 64px}
.promptbox{
  background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.4); border-radius:16px;
  padding:18px 18px 14px; box-shadow:0 8px 32px rgba(0,0,0,.35);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.promptbox:focus-within{border-color:#fff; box-shadow:0 12px 40px rgba(0,0,0,.45)}
.promptbox.err{border-color:#FCA5A5; box-shadow:0 0 0 3px rgba(220,38,38,.10)}
textarea{
  width:100%; min-height:84px; max-height:220px; resize:vertical;
  background:transparent; border:0; color:var(--text); font-size:15px;
  font-family:inherit; line-height:1.55; outline:none; padding:2px 2px 0;
}
textarea::placeholder{color:#888}
.prow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; flex-wrap:wrap}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  background:rgba(255,255,255,.9); border:1px solid var(--border-2); color:var(--dim);
  border-radius:999px; padding:5px 12px; font-size:12.5px; cursor:pointer;
  transition:border-color .12s ease, color .12s ease;
}
.chip:hover{color:var(--text); border-color:#C9C9C9}
.kbd{color:var(--faint); font-size:11px; letter-spacing:.02em; user-select:none}
#runBtn{
  background:var(--text); color:#fff; border:0; border-radius:999px;
  padding:8px 22px; font-size:13.5px; font-weight:550; cursor:pointer;
  transition:background .12s ease, opacity .12s ease;
}
#runBtn:hover{background:#333}
#runBtn:disabled{opacity:.45; cursor:not-allowed}
#validation{color:var(--err); font-size:13px; margin-top:8px; display:none}
#validation.show{display:block}

/* ---------- run meta ---------- */
.runmeta{display:none; align-items:center; gap:8px; font-size:12px; color:rgba(255,255,255,0.9); text-shadow:0 1px 3px rgba(0,0,0,0.6)}
.runmeta.show{display:flex}
.runmeta code{background:rgba(255,255,255,.9); border:0; border-radius:6px; padding:1px 7px; color:#111; font-size:11.5px; font-weight:550; text-shadow:none}
.runmeta #elapsed{font-variant-numeric:tabular-nums}

/* ---------- timeline ---------- */
#timeline{display:none; position:relative}
#timeline:not(:empty){
  display:block; background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.4); border-radius:16px;
  padding:6px 10px 6px 34px;
  box-shadow:0 8px 32px rgba(0,0,0,.35);
}
#timeline:before{
  content:""; position:absolute; left:16px; top:18px; bottom:18px;
  width:1px; background:#E6E6E6;
}
.card{
  position:relative; padding:14px 8px;
  animation:enter .16s ease-out;
}
.card + .card{border-top:1px solid #F1F1F1}
@keyframes enter{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
.card:before{
  content:""; position:absolute; left:-22px; top:19px; width:8px; height:8px;
  border-radius:50%; background:#D4D4D4; box-shadow:0 0 0 3px rgba(255,255,255,.95);
}
.card.d-ok:before{background:var(--ok)}
.card.d-err:before{background:var(--err)}
.card.pending:before{background:var(--warn)}
.chead{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.step{
  color:var(--faint); font-size:11px; font-weight:500;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.nodename{font-size:13.5px; font-weight:600; letter-spacing:-.01em}
.ts{margin-left:auto; color:var(--faint); font-size:11.5px; font-variant-numeric:tabular-nums}
.pill{
  font-size:11px; padding:2px 8px; border-radius:999px;
  border:1px solid var(--border-2); color:var(--dim); background:#fff;
}
.pill.tk{font-family:ui-monospace,monospace; font-size:10.5px; background:#F6F6F6; color:#555; border-color:#ECECEC}
.pill.ok{color:var(--ok); border-color:#D5EADF; background:#F2FAF6}
.pill.warn{color:var(--warn); border-color:#F5E3C8; background:#FDF8EF}
.pill.fail{color:var(--err); border-color:#FADADA; background:#FDF4F4}
.pill.dim{color:#8A8A8A; background:#F6F6F6; border-color:#EEEEEE}
.reasoning{margin:7px 0 0; color:#4A4A4A; font-size:13.5px; line-height:1.55}
.cid{
  display:inline-block; margin-top:9px; font-size:11.5px;
  background:#F6F6F6; border:1px solid #ECECEC; border-radius:7px;
  padding:2px 8px; color:#666; font-family:ui-monospace,monospace;
}
details{margin-top:10px}
details summary{
  cursor:pointer; color:var(--faint); font-size:12px; user-select:none;
  list-style:none; display:inline-flex; align-items:center; gap:4px;
}
details summary:hover{color:var(--dim)}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸"; font-size:10px; transition:transform .12s ease}
details[open] summary:before{transform:rotate(90deg)}
pre{
  background:#F8F8F9; border:1px solid #ECECEC; border-radius:10px;
  padding:10px 12px; font-size:12px; line-height:1.5; overflow:auto; max-height:240px;
  white-space:pre-wrap; word-break:break-word; margin:8px 0 0; color:#333;
}
.k{color:#0F766E; font-weight:600}
.s{color:var(--ok)}
.n{color:var(--warn)}
.decision{
  border-top:1px solid #F1F1F1; margin-top:10px; padding-top:8px;
  font-size:13px; color:#4A4A4A;
}
.dlabel{color:var(--faint); font-size:11.5px; text-transform:none; margin-right:2px}

/* ---------- approval ---------- */
.card.approval{
  background:#FFFDF6; border:1px solid #F1E4BE; border-radius:12px;
  padding:14px 16px; margin:8px 0;
}
.card.approval + .card{border-top:1px solid #F1F1F1}
.card.approval:before{background:var(--warn); box-shadow:0 0 0 3px rgba(255,253,246,.95)}
.approve-row{display:flex; gap:10px; margin-top:12px}
.btn-approve,.btn-deny{
  border-radius:999px; padding:7px 22px; font-weight:550; font-size:13px;
  cursor:pointer; transition:background .12s ease, opacity .12s ease;
}
.btn-approve{background:var(--text); color:#fff; border:0}
.btn-approve:hover{background:#333}
.btn-deny{background:#fff; color:var(--dim); border:1px solid var(--border-2)}
.btn-deny:hover{color:var(--text); border-color:#C9C9C9}
.approve-row button:disabled{opacity:.45; cursor:not-allowed}
.appr-note{color:#8A7A4A; font-size:12px; margin-top:9px}
.appr-note code{background:#F6F1E2; border:1px solid #EDE3C6; padding:1px 6px; border-radius:5px; font-size:11.5px; color:#7A6A3A}
.appr-done{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap}
.countdown{color:var(--warn); font-size:12px}

/* ---------- final ---------- */
#final{
  display:none; background:rgba(255,255,255,.95);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.4); border-radius:16px; padding:22px 24px;
  box-shadow:0 8px 32px rgba(0,0,0,.35);
}
#final.show{display:block}
#final h3{
  margin:0 0 10px; font-size:11px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--faint);
}
#finalBody{font-size:15px; line-height:1.65; white-space:pre-wrap; color:#1F1F1F}
#finalBody code{background:#F4F4F5; padding:1.5px 6px; border-radius:5px; font-size:13px; border:1px solid #ECECEC}
#finalBody em{color:var(--dim)}
.final-actions{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.ghost{
  background:rgba(255,255,255,.9); border:1px solid var(--border-2); color:var(--dim);
  border-radius:9px; padding:7px 14px; font-size:13px; cursor:pointer; text-decoration:none;
  transition:border-color .12s ease, color .12s ease;
}
.ghost:hover{color:var(--text); border-color:#C9C9C9}
#empty{color:rgba(255,255,255,0.75); text-shadow:0 1px 4px rgba(0,0,0,0.8); text-align:center; padding:64px 0 48px; font-size:14px; font-weight:500}

/* ---------- toasts ---------- */
#toasts{position:fixed; top:64px; right:16px; z-index:50; display:flex; flex-direction:column; gap:8px}
.toast{
  display:flex; align-items:flex-start; gap:9px;
  background:rgba(255,255,255,.96); border:1px solid var(--border-2); border-radius:12px;
  padding:10px 14px; font-size:13px; max-width:340px; color:#333;
  box-shadow:0 1px 2px rgba(13,13,13,.05), 0 12px 32px -16px rgba(13,13,13,.25);
  animation:enter .16s ease-out;
}
.toast:before{content:""; width:7px; height:7px; border-radius:50%; background:#1F1F1F; margin-top:6px; flex:none}
.toast.ok:before{background:var(--ok)}
.toast.warn:before{background:var(--warn)}
.toast.error:before{background:var(--err)}

@media (max-width:640px){
  header{padding:0 14px} .brand .sub{display:none}
  main{padding:24px 12px 48px}
  #timeline:not(:empty){padding-left:28px}
  .card:before{left:-18px}
  details{display:none}
  .approve-row{flex-direction:column}
  .approve-row button{width:100%}
  .ts{display:none}
}
@media (prefers-reduced-motion:reduce){
  #bgVideo{display:none}
  .card,.toast{animation:none}
}
</style>
<script src="/static/vendor/tailwind.js"></script>
</head>
<body>

<video id="bgVideo" autoplay muted loop playsinline preload="auto" poster="/static/assets/bg.jpg" aria-hidden="true">
  <source src="/static/assets/bg.mp4" type="video/mp4"/>
</video>
<div id="bgScrim" aria-hidden="true"></div>

<header>
  <div class="brand">
    <h1>LedgerPilot</h1>
  </div>
</header>

<div id="banner">
  <span id="bannerText">Connection lost — retry or use hotspot</span>
  <button onclick="retryStream()">Retry</button>
  <a class="ghost" href="docs/demo/run.mp4" target="_blank">backup video</a>
</div>

<main>
  <div class="promptbox" id="promptbox">
    <textarea id="prompt" placeholder="It's billing day. Find unpaid invoices, chase overdue ones with PayPal, escalate disputes to Jira, log to Notion, summarize in Slack…"></textarea>
    <div class="prow">
      <div class="chips">
        <button class="chip" onclick="useChip(0)">Billing day (full run)</button>
        <button class="chip" onclick="useChip(1)">Only &gt; ₹50,000</button>
        <button class="chip" onclick="useChip(2)">What did we chase this week?</button>
      </div>
      <div class="flex items-center gap-3">
        <span class="kbd" aria-hidden="true">⌘ + ↵</span>
        <button id="runBtn" onclick="run()">Run</button>
      </div>
    </div>
    <div id="validation">Describe the billing task — e.g. “Chase overdue invoices”</div>
  </div>

  <div id="runMeta" class="runmeta"></div>
  <div id="empty">Run a prompt to watch the agent work</div>
  <div id="timeline"></div>

  <div id="final">
    <h3>Result</h3>
    <div id="finalBody"></div>
    <div class="final-actions">
      <button class="ghost" onclick="runAgain()">Run again</button>
      <button class="ghost" onclick="copySummary()">Copy summary</button>
      <a class="ghost" href="docs/demo/run.mp4" target="_blank">Open backup video</a>
    </div>
  </div>
</main>

<div id="toasts"></div>

<script>
const CHIPS = [
  "It's billing day. Find unpaid invoices, chase overdue ones with PayPal, escalate disputes to Jira, log everything to Notion, and summarize in Slack.",
  "Chase only invoices over ₹50,000 with PayPal and log the rest to Notion.",
  "What did we chase this week?"
];
let runId = null, es = null, running = false;
const seen = new Set();          // dedupe rendered events (replay-safe)
let approvalTimers = {};
let elapsedTimer = null;

function useChip(i){ document.getElementById('prompt').value = CHIPS[i]; }

/* ---------- render helpers ---------- */
function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function hl(obj){
  let j = JSON.stringify(obj, null, 2);
  if(!j || j === '{}') return '';
  return esc(j)
    .replace(/"([^"\n]*)"(?=\s*:)/g, '<span class="k">"$1"</span>')
    .replace(/:\s*"([^"\n]*)"/g, ': <span class="s">"$1"</span>')
    .replace(/:\s*(-?\d+\.?\d*)(?=[,\n])/g, ': <span class="n">$1</span>')
    .replace(/:\s*(true|false|null)/g, ': <span class="n">$1</span>');
}

function pill(status){
  const map = {
    ok:['ok','ok'], approved:['ok','approved'], pending_approval:['warn','pending approval'],
    denied:['fail','denied'], failed:['fail','failed'], skipped:['dim','skipped'], seed:['warn','demo data']
  };
  const [cls,label] = map[status] || ['dim', status || 'ok'];
  return `<span class="pill ${cls}">${label}</span>`;
}

function dotClass(status){
  if(status==='ok'||status==='approved') return 'd-ok';
  if(status==='failed'||status==='denied') return 'd-err';
  return '';
}

/* ---------- event dispatch ---------- */
function handle(ev){
  const key = (ev.type==='done'||ev.type==='error') ? ev.type : `${ev.step}:${ev.node}:${ev.ts}:${ev.status||''}`;
  if(seen.has(key)) return; seen.add(key);

  if(ev.type === 'trace' || ev.type === 'approval') return renderCard(ev);
  if(ev.type === 'log') return toast(ev.text, ev.level==='warning'?'warn':'');
  if(ev.type === 'done') return finish(ev.final_answer);
  if(ev.type === 'error'){ banner(ev.text || 'Run failed'); toast(ev.text,'error'); stopRun(); }
}

function renderCard(ev){
  document.getElementById('empty').style.display='none';
  const tl = document.getElementById('timeline');
  const isApproval = ev.type === 'approval';
  const step = String(ev.step ?? '').padStart(2, '0');
  const card = el('div',
    `card ${dotClass(ev.status)}` + (isApproval ? ' approval' : '') + (ev.status==='pending_approval'?' pending':''));

  card.innerHTML = `
    <div class="chead">
      <span class="step">${step}</span>
      <span class="nodename">${esc(ev.node)}</span>
      <span class="pill tk">${esc(ev.toolkit||'none')}</span>
      ${pill(ev.status)}
      <span class="ts">${esc((ev.ts||'').replace('T',' ').replace('Z',''))}</span>
    </div>
    <p class="reasoning">${esc(ev.reasoning||'')}</p>
    ${ev.canonical_id?`<span class="cid">swy exec ${esc(ev.canonical_id)}</span>`:''}
    ${reqResp(ev)}
    ${ev.decision?`<div class="decision"><span class="dlabel">→ decision:</span> ${esc(ev.decision)}</div>`:''}
    ${isApproval?approvalUI(ev):''}
  `;
  tl.appendChild(card);
  card.scrollIntoView({block:'nearest', behavior:'smooth'});

  if(isApproval && ev.status === 'pending_approval'){
    card.dataset.hash = ev.request_hash; card.dataset.invoice = ev.invoice_id;
    startCountdown(card, ev);
  }
}

function reqResp(ev){
  const hasReq = ev.request && Object.keys(ev.request).length;
  const hasRes = ev.response && Object.keys(ev.response).length;
  if(!hasReq && !hasRes) return '';
  return `
    ${hasReq?`<details><summary>request</summary><pre>${hl(ev.request)}</pre></details>`:''}
    ${hasRes?`<details><summary>response</summary><pre>${hl(ev.response)}</pre></details>`:''}`;
}

function approvalUI(ev){
  if(ev.status === 'pending_approval'){
    return `<div class="approve-row">
        <button class="btn-approve" onclick="resolveApproval(this,true)">Approve</button>
        <button class="btn-deny" onclick="resolveApproval(this,false)">Deny</button>
      </div>
      <div class="appr-note">Required by policy <code>policies.json</code> · approval binds to this request <span class="countdown" data-cd></span></div>`;
  }
  const label = ev.status === 'approved' ? 'approved by operator'
              : ev.status === 'denied' ? 'denied by operator'
              : ev.status === 'skipped' ? 'not approved — call skipped' : ev.status;
  return `<div class="appr-done">${pill(ev.status)} <span class="pill dim">${esc(label)}</span></div>`;
}

function startCountdown(card, ev){
  const total = 120; let left = total;
  const span = card.querySelector('[data-cd]');
  const tick = () => {
    if(!span.isConnected) return clearInterval(approvalTimers[ev.invoice_id]);
    span.textContent = `· ${left}s`;
    if(left-- <= 0){ clearInterval(approvalTimers[ev.invoice_id]); span.textContent='· expired'; }
  };
  approvalTimers[ev.invoice_id] = setInterval(tick, 1000); tick();
}

async function resolveApproval(btn, approve){
  const card = btn.closest('.card');
  const payload = {
    run_id: runId, invoice_id: card.dataset.invoice,
    approved: approve, request_hash: card.dataset.hash
  };
  try{
    const r = await fetch('/approve', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    if(!r.ok){ const m = await r.json(); toast(m.detail || 'Approval rejected', 'error'); return; }
    btn.parentElement.querySelectorAll('button').forEach(b=>b.disabled=true);
    clearInterval(approvalTimers[payload.invoice_id]);
    toast(approve ? 'PayPal chase approved' : 'Chase denied — invoice will be skipped', approve?'ok':'warn');
  }catch(e){ banner('Approval failed — connection lost'); }
}

/* ---------- run lifecycle ---------- */
async function run(){
  const prompt = document.getElementById('prompt').value.trim();
  const vb = document.getElementById('validation'), pb = document.getElementById('promptbox');
  if(prompt.length < 10){ vb.classList.add('show'); pb.classList.add('err'); setTimeout(()=>pb.classList.remove('err'),500); return; }
  vb.classList.remove('show');
  if(running) return;
  resetView();
  try{
    const r = await fetch('/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt})});
    if(!r.ok){ const m = await r.json(); toast(m.detail || 'Could not start run', 'error'); return; }
    const {run_id} = await r.json();
    runId = run_id; startStream();
  }catch(e){ banner('Cannot reach server — is it running?'); }
}

function showRunMeta(){
  const m = document.getElementById('runMeta');
  m.innerHTML = `<span>Run</span><code>${esc(String(runId||'…'))}</code><span id="elapsed">0s</span>`;
  m.classList.add('show');
  const start = Date.now();
  clearInterval(elapsedTimer);
  elapsedTimer = setInterval(()=>{
    const e = document.getElementById('elapsed');
    if(e) e.textContent = Math.round((Date.now()-start)/1000) + 's';
  }, 1000);
}

function startStream(){
  stopRun(true); running = true;
  document.getElementById('runBtn').disabled = true;
  document.getElementById('runBtn').textContent = 'Running…';
  showRunMeta();
  es = new EventSource('/stream/' + runId);
  es.onmessage = e => { try{ handle(JSON.parse(e.data)); }catch(_){} };
  es.onerror = () => { if(running) banner('Connection lost — retry or switch to hotspot'); };
  es.onopen = () => hideBanner();
}

function stopRun(keepBanner){
  if(es){ es.close(); es=null; }
  running = false;
  clearInterval(elapsedTimer);
  const b = document.getElementById('runBtn'); b.disabled=false; b.textContent='Run';
  if(!keepBanner) hideBanner();
}

function finish(answer){
  const f = document.getElementById('final');
  document.getElementById('finalBody').innerHTML = md(answer);
  f.classList.add('show');
  stopRun();
  toast('Run complete', 'ok');
  f.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function runAgain(){ resetView(); document.getElementById('prompt').value = CHIPS[0]; run(); }

function md(text){
  let t = esc(text);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/^_([^_]+)_$/gm, '<em>$1</em>');
  return t;
}

function resetView(){
  document.getElementById('timeline').innerHTML = '';
  document.getElementById('final').classList.remove('show');
  document.getElementById('empty').style.display='';
  const m = document.getElementById('runMeta');
  m.classList.remove('show'); m.innerHTML='';
  clearInterval(elapsedTimer);
  seen.clear(); Object.values(approvalTimers).forEach(clearInterval); approvalTimers = {};
}

function copySummary(){
  const txt = document.getElementById('finalBody').innerText;
  navigator.clipboard?.writeText(txt).then(()=>toast('Copied','ok'), ()=>toast('Copy failed','error'));
}

/* ---------- chrome ---------- */
function toast(text, cls){
  const t = el('div','toast '+(cls||''), esc(text));
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 5000);
}
function banner(text){ document.getElementById('bannerText').textContent = text; document.getElementById('banner').classList.add('show'); }
function hideBanner(){ document.getElementById('banner').classList.remove('show'); }
function retryStream(){ hideBanner(); if(runId && running) startStream(); }

fetch('/healthz').then(r=>r.json()).then(h=>{
  const p = document.getElementById('statusPill');
  if(p){
    const n = (h.toolkits||[]).length;
    if(h.swx_mode === 'live' && n){ p.textContent = `● ${n} toolkits connected`; p.className='ok'; }
    else { p.textContent = `● mock mode · ${n} toolkits wired`; p.className='warn'; }
  }
  if(h.llm === 'mock') toast('LLM running in deterministic mock mode', 'warn');
}).catch(()=>{
  const p = document.getElementById('statusPill');
  if(p){ p.textContent='● server offline'; p.className='warn'; }
});

document.getElementById('prompt').addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key==='Enter') run();
});

/* animated background: pause when tab hidden, tolerate autoplay policies */
const bgVideo = document.getElementById('bgVideo');
document.addEventListener('visibilitychange', ()=>{
  if(!bgVideo) return;
  if(document.hidden) bgVideo.pause();
  else bgVideo.play().catch(()=>{});
});
if(bgVideo) bgVideo.play().catch(()=>{});
</script>
